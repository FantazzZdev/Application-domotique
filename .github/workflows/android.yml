name: APK Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Clé de signature fixe (secrets du dépôt) : les nouveaux APK
      # s'installent comme des mises à jour, sans désinstaller.
      - name: Préparer la clé de signature
        env:
          DOMUS_KEYSTORE_B64: ${{ secrets.DOMUS_KEYSTORE_B64 }}
          DOMUS_KEYSTORE_PASSWORD: ${{ secrets.DOMUS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$DOMUS_KEYSTORE_B64" ]; then
            # Tolère espaces et retours à la ligne ajoutés au copier-coller.
            printf '%s' "$DOMUS_KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/domus.p12"
            PW="$(printf '%s' "$DOMUS_KEYSTORE_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            echo "::add-mask::$PW"
            if keytool -list -keystore "$RUNNER_TEMP/domus.p12" -storetype PKCS12 -storepass "$PW" -alias domus > /dev/null; then
              echo "Clé de signature valide."
            else
              B64LEN=$(printf '%s' "$DOMUS_KEYSTORE_B64" | tr -d ' \r\n\t' | wc -c)
              echo "::error::Clé illisible. Longueurs reçues : DOMUS_KEYSTORE_B64 = $B64LEN caractères (3528 attendus), DOMUS_KEYSTORE_PASSWORD = ${#PW} caractères (24 attendus)."
              exit 1
            fi
            echo "DOMUS_KEYSTORE_PATH=$RUNNER_TEMP/domus.p12" >> "$GITHUB_ENV"
            echo "DOMUS_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret DOMUS_KEYSTORE_B64 absent : APK signé avec une clé temporaire (pas de mise à jour possible)."
          fi
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: DeltaHome-apk
          path: build/app/outputs/flutter-apk/app-release.apk
